[project]
name = "philip"
version = "0.4.0"
description = "Bub main entrypoint project — startup, sandbox, and plugin assembly"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "any-llm-sdk>=1.13.0",
    "bub[app] @ git+https://github.com/bubbuild/bub.git@0.6.0",
    "bub-im-bridge @ git+https://github.com/iodone/bub-im-bridge.git@4c6587e",
    "bub-web-search @ git+https://github.com/bubbuild/bub-contrib.git@35c84fb#subdirectory=packages/bub-web-search",
    "bub-schedule @ git+https://github.com/bubbuild/bub-contrib.git@35c84fb#subdirectory=packages/bub-schedule",
    "jieba>=0.42",
    "python-frontmatter>=1.0",
    "ripgrepy>=2.2",
    "rub @ git+https://github.com/iodone/rubick.git@main",
    "types-PyYAML>=6.0",
]

[project.scripts]
philip = "philip.cli.__main__:app"

[dependency-groups]
dev = [
    "black>=24.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.entry-points.bub]
philip = "philip.plugins.plugin:PhilipPlugin"

[project.entry-points.'rub.adapters']
philip = "philip.cli.adapter:PhilipAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/philip"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
default-groups = []
override-dependencies = [
    "bub[app] @ git+https://github.com/bubbuild/bub.git@0.6.0",
]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "bub.*",
    "jieba.*",
    "ripgrepy.*",
    "rub.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "philip.channels.jsonrpc_channel",
    "philip.cli.adapter",
    "philip.plugins.plugin",
    "philip.tools.vision_tools",
]
disable_error_code = ["misc"]
disallow_any_generics = false
disallow_untyped_decorators = false
warn_return_any = false

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:py_mini_racer",
]
